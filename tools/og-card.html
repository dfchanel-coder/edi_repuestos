<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Barlow Condensed";
    src: url("../assets/fonts/barlow-condensed-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "Inter";
    src: url("../assets/fonts/inter-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0b08;
    color: #f3f2ec;
    font-family: "Inter", sans-serif;
    position: relative;
    padding: 54px 64px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-image:
      linear-gradient(rgba(116,195,44,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(116,195,44,.07) 1px, transparent 1px);
    background-size: 76px 76px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 250px; height: auto; mix-blend-mode: screen; }
  .brand span {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    line-height: 1;
  }
  .brand strong { color: #74c32c; }
  .tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #74c32c;
    border: 1px solid rgba(116,195,44,.45);
    padding: 10px 14px;
  }
  main { position: relative; z-index: 2; margin-top: 8px; }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #a9ab9d;
    margin-bottom: 18px;
  }
  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 94px;
    font-weight: 700;
    line-height: .84;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  h1 em { font-style: normal; color: #74c32c; }
  .sub {
    margin-top: 22px;
    font-size: 18px;
    color: #c8c9bd;
    letter-spacing: .01em;
  }
  .sub b { color: #f3f2ec; font-weight: 600; }
  footer {
    display: flex;
    align-items: center;
    gap: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(243,242,236,.18);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #a9ab9d;
    position: relative;
    z-index: 2;
  }
  footer span:first-child { color: #74c32c; }
  .mark {
    position: absolute;
    right: -28px;
    bottom: -42px;
    z-index: 1;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 440px;
    font-weight: 700;
    line-height: .7;
    color: transparent;
    -webkit-text-stroke: 2px rgba(116,195,44,.16);
    letter-spacing: -.04em;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img src="../assets/img/edi-logo-640.webp" alt="">
      <span><strong>EDI</strong> REPUESTOS</span>
    </div>
    <span class="tag">Rivera · Uruguay</span>
  </div>

  <main>
    <p class="eyebrow">Casa de repuestos · Frontera con Santana do Livramento</p>
    <h1>Repuestos y accesorios<br>automotores<br><em>en Rivera</em></h1>
    <p class="sub"><b>Multimarca.</b> Consultá disponibilidad en el local.</p>
  </main>

  <footer>
    <span>Dr. Fernández Crespo 570</span>
    <span>4622 7161</span>
    <span>@edirepuestos</span>
  </footer>

  <span class="mark">570</span>
</body>
</html>
